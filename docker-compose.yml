services:
  workvault:
    image: ghcr.io/tkmrqq/workvault:latest
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data          # SQLite + uploads — персистентность
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Healthcheck — docker будет знать что контейнер реально живой
    healthcheck:
      test: ["CMD", "node", "-e", 
        "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped
  
  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped