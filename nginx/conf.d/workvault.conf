limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
# /uploads: картинки/видео/pdf открываются в браузере, всё остальное — только скачиванием
map $uri $wv_upload_disposition {
    ~*\.(jpe?g|png|gif|webp|mp4|webm|mov|mkv|pdf)$ "";
    default "attachment";
}
# CSP-песочница ломает встроенный PDF-просмотрщик Chrome, поэтому для pdf её не ставим
map $uri $wv_upload_csp {
    ~*\.pdf$ "";
    default "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox";
}
# Вход/регистрация/рефреш приложения — раньше на /api/auth лимита не было вообще
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;

upstream workvault_backend {
    server workvault:3000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 100M;
    server_tokens off;

    # Базовые заголовки безопасности. ВНИМАНИЕ: add_header внутри location
    # полностью переопределяет серверные, поэтому в /uploads/ они повторены.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Файлы из чата отдаёт nginx напрямую (express сюда не доходит), поэтому
    # защиту от XSS через загруженные файлы ставим здесь: nosniff + песочница,
    # а всё, что не картинка/видео/pdf — только скачиванием.
    location /uploads/ {
        alias /data/uploads/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $wv_upload_csp always;
        add_header Content-Disposition $wv_upload_disposition always;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        aio threads;
    }

    # Лимит только на сам логин (брутфорс-защита) — GET/POST /admin/login.
    # На дэшборд и его fetch-запросы (очистка истории, удаление и т.п.)
    # rate=5r/m не распространяется, иначе выжирался за пару кликов.
    location = /admin/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://workvault_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://workvault_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://workvault_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://workvault_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://workvault_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}